name: Build Personal Band Package

on:
  workflow_dispatch:
    inputs:
      gemini_api_key:
        description: 'Google Gemini API Key (from aistudio.google.com)'
        required: true
        type: string
      default_model:
        description: 'Default AI Model'
        required: false
        default: 'gemini-2.5-flash'
        type: choice
        options:
          - 'gemini-2.5-flash'
          - 'gemini-2.0-flash'
          - 'gemini-1.5-flash'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package for Mi Band 7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install -g @zeppos/zeus-cli
          pip install qrcode[pil]

      - name: Build and Patch Package
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
          DEFAULT_MODEL: ${{ inputs.default_model }}
        run: |
          # 1. Write config.js for local builder
          echo "module.exports = { GEMINI_API_KEY: process.env.GEMINI_API_KEY };" > config.js

          # 2. Build with Zeus CLI
          zeus build || true

          # 3. Extract gemini_band.zpk from .zab
          mkdir -p dist
          ZAB_FILE=$(ls dist/*.zab 2>/dev/null | head -n 1)
          if [ -n "$ZAB_FILE" ] && [ -f "$ZAB_FILE" ]; then
            ZPK_NAME=$(unzip -l "$ZAB_FILE" | grep "\.zpk" | awk '{print $4}' | head -n 1)
            if [ -n "$ZPK_NAME" ]; then
              unzip -p "$ZAB_FILE" "$ZPK_NAME" > dist/gemini_band.zpk
            fi
          fi

          # 4. Fallback: if gemini_band.zpk not built, use base package from docs
          if [ ! -f "dist/gemini_band.zpk" ] && [ -f "docs/gemini_band.zpk" ]; then
            cp docs/gemini_band.zpk dist/gemini_band.zpk
          fi

          # 5. Patch gemini_band.zpk with user's API key
          python3 patch_zpk.py dist/gemini_band.zpk dist/gemini_band_patched.zpk "$GEMINI_API_KEY"
          mv dist/gemini_band_patched.zpk dist/gemini_band.zpk
          echo "Successfully created and patched dist/gemini_band.zpk"

      - name: Generate Release Assets & QR Codes
        run: |
          python3 .github/scripts/generate_release_assets.py \
            dist/gemini_band.zpk \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${{ github.repository }}" \
            "${{ inputs.default_model }}"

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clean up previous personal-build release and tag if existing
          gh release delete "personal-build" --yes --cleanup-tag 2>/dev/null || true
          git tag -d personal-build 2>/dev/null || true

          gh release create "personal-build" \
            dist/gemini_band.zpk \
            public/qr_release.png \
            public/qr_pages.png \
            --title "Personal Gemini Band Build" \
            --notes "Personal Mi Band 7 package with pre-configured API key. Generated by ${{ github.actor }}." \
            --prerelease=false 2>/dev/null || \
          gh release upload "personal-build" dist/gemini_band.zpk public/qr_release.png public/qr_pages.png --clobber

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Output Step Summary
        run: |
          cat step_summary.md >> $GITHUB_STEP_SUMMARY
